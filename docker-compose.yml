# Fotogalerie mit Gesichtserkennung (Immich). Liegt auf dem Server in ~/fotos/ zusammen mit .env (Vorlage: env.example).
# Basiert auf der offiziellen docker-compose.yml von Immich (v3). Bei einem Versionssprung mit
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml vergleichen.
#
# Läuft neben dem Liveticker-Portal (anderes Projekt). Das HTTPS übernimmt dessen Caddy; Immich hängt sich dafür an das
# Netzwerk "web", das das Portal anlegt.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      # Uploads über die Weboberfläche, Vorschaubilder, Videos (lokale Disk)
      - ${UPLOAD_LOCATION:-./library}:/data
      # Spieltagsfotos auf der Storage Box, nur lesend. Fehlt die Einhängung, startet der Container nicht, statt mit einem
      # leeren Ordner zu laufen (Immich würde sonst alle Fotos als gelöscht markieren).
      - type: bind
        source: /mnt/fotos
        target: /external/fotos
        read_only: true
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    depends_on:
      - redis
      - database
    networks: [default, web]
    # Der Server ist klein (4 GB RAM, 2 vCPU) und teilt sich die Maschine mit dem Liveticker: Grenzen verhindern,
    # dass eine Foto-Indexierung das Portal aus dem Speicher drängt.
    mem_limit: 1536m
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    mem_limit: 1536m
    cpus: 1.0
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    mem_limit: 128m
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Die Datenbank muss auf der lokalen Disk liegen, nie auf der Storage Box
      - ${DB_DATA_LOCATION:-./postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    mem_limit: 512m
    restart: always
    healthcheck:
      disable: false

  # Legt für jeden Ordner der externen Bibliothek ein Album an und trägt neue Fotos nach (siehe album-sync.py).
  # Braucht IMMICH_API_KEY in .env; ohne ihn wartet der Dienst nur.
  album-sync:
    container_name: immich_album_sync
    image: python:3.13-alpine
    command: ["python", "-u", "/app/album-sync.py"]
    environment:
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      SYNC_INTERVAL: ${ALBUM_SYNC_INTERVAL:-900}
    volumes:
      - ./album-sync.py:/app/album-sync.py:ro
      - album-sync-state:/state
    depends_on:
      - immich-server
    mem_limit: 64m
    restart: unless-stopped

networks:
  web:
    external: true

volumes:
  model-cache:
  album-sync-state:
